<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="learnmate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3525CD" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#learnmate-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />

  <!-- Open Book / Learning Pathway (Crisp Vector) -->
  <g filter="url(#shadow)">
    <!-- Left Leaf -->
    <path
      d="M15 22 C21 19 28 21 30.5 24 L30.5 47 C28 44 21 42 15 45 Z"
      fill="#FFFFFF"
    />
    <!-- Right Leaf -->
    <path
      d="M49 22 C43 19 36 21 33.5 24 L33.5 47 C36 44 43 42 49 45 Z"
      fill="#FFFFFF"
    />
    <!-- Central Spine Bookmark Line -->
    <line x1="32" y1="23" x2="32" y2="48" stroke="#E0E7FF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- AI Sparkle Indicator (Top Right) -->
  <path
    d="M48 8 C48 12.5 50.5 14 54 14 C50.5 14 48 15.5 48 20 C48 15.5 45.5 14 42 14 C45.5 14 48 12.5 48 8 Z"
    fill="#38BDF8"
  />
  <circle cx="48" cy="14" r="1.5" fill="#FFFFFF" />
</svg>
